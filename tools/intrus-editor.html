<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Historia — éditeur d'intrus</title>
<style>
body{font:16px/1.4 system-ui,sans-serif;margin:0;background:#f4ecd8;color:#3a2914}
header{padding:12px 16px;background:#3a2914;color:#f4ecd8}
main{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:16px;padding:16px}
@media(max-width:800px){main{grid-template-columns:1fr}}
#wrap{position:relative;border:3px solid #b8892b;background:#000;line-height:0}
#wrap img{width:100%;height:auto}
#wrap svg{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
label{display:block;margin:6px 0 2px;font-size:14px}
input,textarea,button{font:inherit;padding:6px;width:100%;box-sizing:border-box}
button{width:auto;cursor:pointer}
.card{background:#fff9e8;border:1px solid #b8892b;border-radius:8px;padding:10px;margin-bottom:10px}
pre{background:#222;color:#9f9;padding:10px;overflow:auto;white-space:pre-wrap;font-size:13px}
</style></head><body>
<header><b>Éditeur d'intrus</b> — 1. choisis l'image · 2. clique sur chaque objet moderne caché · 3. remplis les textes · 4. copie le bloc</header>
<main>
 <div>
  <input type="file" id="f" accept="image/*">
  <p>Clique <b>exactement au centre</b> de chaque intrus (3 clics). Le cercle vert = zone où le joueur pourra toucher.</p>
  <div id="wrap"><img id="im" alt=""><svg id="ov"></svg></div>
 </div>
 <div>
  <div class="card"><label>Titre FR</label><input id="tfr" value="Le grand banquet"><label>Titre EN</label><input id="ten" value="The great banquet"><label>Nom du fichier (dans www/img/intrus/)</label><input id="fn" value="banquet.jpg"><label>Rayon de détection (px de l'image) <span id="rv"></span></label><input type="range" id="rad" min="15" max="150" value="50"></div>
  <div id="list"></div>
  <button id="undo">Annuler le dernier</button>
  <h3>Bloc à coller dans js/intrus-images.js</h3>
  <pre id="out">—</pre><button id="copy">Copier</button>
 </div>
</main>
<script>
const $=(i)=>document.getElementById(i);let pts=[],W=0,H=0;
$("f").onchange=(e)=>{const f=e.target.files[0];if(!f)return;$("im").src=URL.createObjectURL(f);$("fn").value=f.name;};
$("im").onload=()=>{W=$("im").naturalWidth;H=$("im").naturalHeight;$("ov").setAttribute("viewBox",`0 0 ${W} ${H}`);draw();};
$("ov").onclick=(e)=>{if(!W)return;const b=$("ov").getBoundingClientRect();pts.push({x:Math.round((e.clientX-b.left)/b.width*W),y:Math.round((e.clientY-b.top)/b.height*H),r:+$("rad").value,nf:"",ne:"",tf:"",te:""});draw();};
$("undo").onclick=()=>{pts.pop();draw();};
$("rad").oninput=()=>{pts.forEach(p=>p.r=+$("rad").value);draw();};
function draw(){
 $("rv").textContent=$("rad").value;
 $("ov").innerHTML=pts.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="${p.r}" fill="rgba(34,197,94,.25)" stroke="#22c55e" stroke-width="${Math.max(2,W/400)}"/><text x="${p.x}" y="${p.y}" font-size="${W/30}" fill="#fff" text-anchor="middle" dominant-baseline="middle">${i+1}</text>`).join("");
 $("list").innerHTML=pts.map((p,i)=>`<div class="card"><b>Intrus ${i+1}</b> (${p.x}, ${p.y})<label>Nom FR</label><input data-i="${i}" data-k="nf" value="${p.nf}"><label>Nom EN</label><input data-i="${i}" data-k="ne" value="${p.ne}"><label>Anecdote FR</label><textarea data-i="${i}" data-k="tf">${p.tf}</textarea><label>Anecdote EN</label><textarea data-i="${i}" data-k="te">${p.te}</textarea></div>`).join("");
 document.querySelectorAll("#list [data-k]").forEach(el=>el.oninput=()=>{pts[+el.dataset.i][el.dataset.k]=el.value;out();});
 out();
}
const q=(s)=>JSON.stringify(s);
function out(){
 $("out").textContent=`{
  id: ${q($("fn").value.replace(/\.[^.]+$/,""))},
  img: ${q("img/intrus/"+$("fn").value)}, w: ${W}, h: ${H},
  title: { fr: ${q($("tfr").value)}, en: ${q($("ten").value)} },
  intruders: [
${pts.map(p=>`    { x: ${p.x}, y: ${p.y}, r: ${p.r}, name: { fr: ${q(p.nf)}, en: ${q(p.ne)} }, text: { fr: ${q(p.tf)}, en: ${q(p.te)} } }`).join(",\n")}
  ]
},`;
}
["tfr","ten","fn"].forEach(i=>$(i).oninput=out);
$("copy").onclick=()=>navigator.clipboard.writeText($("out").textContent);
</script></body></html>

name: Paquet Android
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
      # Le fichier de clé reste secret (dans KEYSTORE_BASE64). Son mot de passe seul ne sert à rien sans le fichier.
      KEY_ALIAS: historia
      KEYSTORE_PASSWORD: HistoriaPlay2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accepter les licences Android (SDK déjà présent sur la machine GitHub)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Installer les dépendances et fabriquer les icônes
        run: |
          npm install --no-audit --no-fund
          node scripts/prepare-assets.mjs

      - name: Créer le projet Android
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#14224f' --splashBackgroundColor '#0b1430'
          npx cap sync android
          node scripts/patch-android.mjs

      - name: Construire l'APK de test
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Historia-APK-test
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Construire le paquet pour le Play Store (AAB)
        if: env.HAS_KEY == 'true'
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Signer le paquet
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | tail -1

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: Historia-AAB-Play-Store
          path: android/app/build/outputs/bundle/release/app-release.aab
